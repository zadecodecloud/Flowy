<svg xmlns="http://www.w3.org/2000/svg" width="560" height="300" viewBox="0 0 560 300" font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1b2a4a"/><stop offset="1" stop-color="#4a2c5e"/></linearGradient>
  <linearGradient id="art" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ff5e8a"/><stop offset="1" stop-color="#ff9f43"/></linearGradient>
  <clipPath id="r"><rect width="560" height="300" rx="22"/></clipPath></defs>
  <g clip-path="url(#r)"><rect width="560" height="300" fill="url(#bg)"/>
  <text x="280" y="62" text-anchor="middle" fill="#fff" font-size="46" font-weight="300">9:41</text>
  <text x="280" y="86" text-anchor="middle" fill="#fff" fill-opacity=".7" font-size="13">Wednesday, November 11</text>
  <rect x="150" y="104" width="260" height="96" rx="22" fill="#fff" fill-opacity=".14" stroke="#fff" stroke-opacity=".2"/>
