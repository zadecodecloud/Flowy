  <rect x="166" y="178" width="228" height="3" rx="1.5" fill="#fff" fill-opacity=".25"/>
  <rect x="166" y="178" width="90" height="3" rx="1.5" fill="#fff"><animate attributeName="width" dur="6s" values="70;150" repeatCount="indefinite"/></rect>
  <text x="28" y="252" fill="#fff" font-size="22" font-weight="700">Music on the lock screen</text>
  <text x="28" y="278" fill="#fff" fill-opacity=".72" font-size="14">A glass player with lyrics while your Mac is locked. (Pro)</text></g>
